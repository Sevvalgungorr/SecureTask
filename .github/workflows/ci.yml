name: CI

  on:
    push:
      branches: [main]
    pull_request:

  jobs:
    test:
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_USER: securetask
            POSTGRES_PASSWORD: securetask
            POSTGRES_DB: securetask_test
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      env:
        DATABASE_URL: postgresql+psycopg2://securetask:securetask@localhost:5432/securetask_test
        TEST_DATABASE_URL: postgresql+psycopg2://securetask:securetask@localhost:5432/securetask_test
        OIDC_CLIENT_ID: test-client
        OIDC_CLIENT_SECRET: test-secret
        SESSION_SECRET: test-session-secret

      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install -r requirements-dev.txt

        - name: Run tests
          run: pytest -q
