services:
  api:
    build: .
    container_name: securetask-api
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: securetask-db
    environment:
      POSTGRES_USER: securetask
      POSTGRES_PASSWORD: securetask123
      POSTGRES_DB: securetask
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: